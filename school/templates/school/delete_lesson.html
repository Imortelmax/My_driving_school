{% extends "school/base.html" %}

{% block title %}Delete Lesson{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-trash"></i> Delete Lesson
            </div>
            <div class="card-body text-center">
                <p class="mb-1">Are you sure you want to delete this lesson?</p>
                <h5 class="text-danger mb-1">{{ lesson.student }} — {{ lesson.instructor }}</h5>
                <p class="text-muted mb-4">{{ lesson.date }} — {{ lesson.location }}</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                        <a href="{% url 'secretary_schedule' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
